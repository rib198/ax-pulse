<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة إدارة الرادار</title>
  <meta name="description" content="لوحة إدارة محتوى الرادار — تعديل ورفع المحتوى عبر GitHub بدون خادم." />
</head>
<body>
  <!-- Decap CMS — free, git-based admin panel.
       Workflow: editor signs in with GitHub OAuth, edits content via a web UI,
       Decap commits the changes to the configured repo. No backend needed.
       Setup checklist (one-time):
         1) Deploy this site to Netlify (Decap requires Git Gateway on Netlify
            OR a separate OAuth provider). Netlify has a free tier.
         2) Enable Identity + Git Gateway in your Netlify site settings.
         3) Invite editors via email from the Identity tab.
         4) Visit /admin/ and sign in with the email you invited.
       Alternative: use the public OAuth flow (no Netlify) by configuring
       backend.repo + backend.branch with a GitHub OAuth app.
       Docs: https://decapcms.org/docs/intro/  -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
