name: Refresh AI Radar

# Cron: every 2 hours (matches X API Basic rate-limit comfortably).
# manual: workflow_dispatch lets you trigger from the Actions tab anytime.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      x_limit:
        description: 'How many X posts to request (max 100)'
        required: false
        default: '25'
      days:
        description: 'RSS window in days'
        required: false
        default: '30'

permissions:
  contents: write   # needed so the bot can commit data/* back

concurrency:
  group: refresh-radar
  cancel-in-progress: false   # never overlap two runs (X rate-limit safety)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true   # so we can push using GITHUB_TOKEN

      - name: Sync latest main
        run: |
          BRANCH="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache translation memory
        uses: actions/cache@v4
        with:
          path: data/radar/_translations_ar.json
          key: translations-${{ github.sha }}
          restore-keys: |
            translations-

      - name: Run radar MVP pipeline
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set -e
          X_LIMIT="${{ github.event.inputs.x_limit || '25' }}"
          ORCH_ARGS=(
            --run-collector
            --run-evidence-guard
            --run-radar-editor
            --run-opportunity-builder
            --run-focused-updates
            --run-focused-discussions
            --run-validation-layer
            --run-review-queue
            --pulse-arg=--include-browser-sources
          )
          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "::warning::X_BEARER_TOKEN غير مضبوط — سيتخطى الـ X collector ويعمل على RSS/Reddit/GitHub فقط"
            ORCH_ARGS+=(--pulse-arg=--include-x-notice)
          else
            python3 tools/x_focus_accounts.py || echo "::warning::تعذر تحديث قائمة مراقبة X — سنستخدم آخر نسخة محفوظة"
            ORCH_ARGS+=(--pulse-arg=--x-limit --pulse-arg="$X_LIMIT")
            for LAYER in builders coding research creative business official; do
              QUERY="$(python3 tools/build_x_focus_query.py --layer "$LAYER" --top 8)"
              ORCH_ARGS+=(--pulse-arg=--x-query --pulse-arg="$QUERY")
            done
          fi
          python3 tools/radar_orchestrator.py "${ORCH_ARGS[@]}"

      - name: Run fetch_ai_newsletters (RSS supplementary)
        run: |
          DAYS="${{ github.event.inputs.days || '30' }}"
          python3 tools/fetch_ai_newsletters.py --days "$DAYS" --max-per-source 40 || echo "::warning::RSS aggregator failed — continuing"

      - name: Translate new signals to Arabic
        run: |
          python3 tools/translate_signals.py || echo "::warning::translation step failed — continuing"

      - name: Validate radar reliability output
        run: |
          python3 tools/audit_radar_reliability.py
          python3 tools/validate_radar_cards.py

      - name: Commit & push data changes
        run: |
          git config user.name  "ax-pulse-bot"
          git config user.email "ax-pulse-bot@users.noreply.github.com"

          if git diff --quiet -- data/ ; then
            echo "no data changes — nothing to commit"
            exit 0
          fi

          git add data/
          git commit -m "chore(radar): auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"

          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi

            echo "::warning::push rejected on attempt ${attempt}; rebasing on latest ${BRANCH} and retrying"
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
          done

          echo "::error::failed to push after rebasing on latest ${BRANCH}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "### AX Pulse — جولة تحديث" >> $GITHUB_STEP_SUMMARY
          if [ -f data/radar/signals.json ]; then
            count=$(python3 -c "import json; print(json.load(open('data/radar/signals.json')).get('count', 0))")
            echo "- إشارات: $count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/radar/run_status.json ]; then
            python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d=json.load(open('data/radar/run_status.json'))
          print(f"- حالة التشغيل: {d.get('status')}")
          print(f"- مصادر ناجحة: {len(d.get('sources_succeeded', []))}")
          print(f"- مصادر فاشلة: {', '.join(d.get('sources_failed', [])) or '-'}")
          print(f"- مصادر متخطاة: {', '.join(d.get('skipped_sources', [])) or '-'}")
          for err in d.get('errors', [])[:5]:
              print(f"  - {err.get('source')}: {err.get('error')}")
          PY
          fi
          if [ -f data/radar/opportunities.json ]; then
            opps=$(python3 -c "import json; d=json.load(open('data/radar/opportunities.json')); print(len(d.get('opportunities', [])))")
            echo "- فرص: $opps" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/newsletters/items.json ]; then
            news=$(python3 -c "import json; print(json.load(open('data/newsletters/items.json')).get('total_items', 0))")
            echo "- نشرات RSS: $news" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- وقت التشغيل: $(date -u)" >> $GITHUB_STEP_SUMMARY
