name: Refresh Radar (agent pipeline)

# Cron: every 2 hours. Runs the 15-agent pipeline end-to-end on free
# GitHub Actions minutes (~2 min per run, ~720 min/month — well below
# the 2,000 min/month free quota for public repos).
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      x_limit:
        description: 'X posts per query (max 100)'
        required: false
        default: '25'
      days:
        description: 'RSS window in days'
        required: false
        default: '30'
      limit:
        description: 'Items per source'
        required: false
        default: '25'
      use_openai:
        description: 'Use OpenAI for editor + opportunities (set false for cheap rule-based run)'
        required: false
        default: 'true'
      budget:
        description: 'Max OpenAI calls per run'
        required: false
        default: '40'

permissions:
  contents: write   # needed so the bot can commit data/* back

concurrency:
  group: refresh-radar
  cancel-in-progress: false   # never overlap two runs (X rate-limit safety)

# Opt actions still on Node 20 onto Node 24 ahead of the June 2026 forced cutover.
# Keeps the runner from emitting deprecation warnings on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job timeout = 30 min, raised after production observation that
    # X auto-collect runs were eating the previous 15-min budget and
    # GitHub was cancelling the whole job before the agent pipeline +
    # commit step could run. With per-step caps in place below, the
    # 30-min ceiling gives generous headroom for the radar pipeline
    # (5-8 min real) + translation + commit, even if every external
    # source step burns its full cap.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Always install the openai SDK. It's tiny (~few hundred KB), and the
      # pipeline gracefully degrades to rule-based mode if no key is present.
      # Doing it unconditionally avoids a fragile `if: env.X != ''` guard
      # (step-level env isn't visible in step `if:` conditions).
      - name: Install Python deps
        run: pip install --quiet openai

      - name: Cache translation memory
        uses: actions/cache@v4
        with:
          path: data/radar/_translations_ar.json
          key: translations-${{ github.sha }}
          restore-keys: |
            translations-

      # ----- Optional supplementary RSS fetch (Ben's Bites, TLDR AI, etc.) -----
      # Hard timeout: a hung newsletter feed must not eat into the radar
      # pipeline's budget. `continue-on-error` alone doesn't help against
      # slow hangs — it only catches *fast* failures. The step-level
      # `timeout-minutes` kills the process if it overruns.
      - name: Fetch supplementary AI newsletters
        continue-on-error: true
        timeout-minutes: 3
        run: |
          DAYS="${{ github.event.inputs.days || '30' }}"
          python3 tools/fetch_ai_newsletters.py --days "$DAYS" --max-per-source 40

      # ----- Auto-collect new X tweets (X API + Nitter fallback) + enrich.
      # Runs BEFORE the agent pipeline so freshly fetched tweets flow through
      # manual_x_bridge and reach the UI in the same cron tick.
      #
      # CRITICAL: X auto-collect has historically hung on slow Nitter mirrors
      # for the full job duration, consuming the entire budget and starving
      # the agent pipeline + commit step. The 6-minute step timeout caps the
      # damage — if X stalls, this step is killed, continue-on-error swallows
      # the kill, and the radar pipeline continues with whatever tweets we
      # had before this run. The user-facing UI never goes empty.
      #
      # 6 min (raised from 4) gives slow-but-functional Nitter mirrors enough
      # time to finish naturally on a normal day, while still leaving 24 min
      # of the 30-min job budget for the rest of the pipeline.
      - name: Auto-collect X (with smart enrich)
        continue-on-error: true
        timeout-minutes: 6
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # Belt-and-braces: kill x_auto_collect.py at 330s even if the GitHub
          # step-level timeout misses a stuck subprocess. Exit 0 either way
          # so a hung mirror never marks the workflow as failed.
          timeout --preserve-status 330 python3 tools/x_auto_collect.py || \
            echo "::warning::x_auto_collect timed out or failed; radar pipeline will continue with prior tweets."
          # x_auto_collect.py runs x_smart_enrich.py internally, so no need
          # to invoke it separately.

      # ----- Main 15-agent pipeline -----
      # AX_POST_AI is the user-chosen secret name for the OpenAI key.
      # We map it to OPENAI_API_KEY here so the Python code stays generic
      # (the agents read OPENAI_API_KEY from env). Add a fallback to
      # OPENAI_API_KEY in case the secret is renamed back later.
      - name: Run radar agent pipeline
        env:
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}
          OPENAI_API_KEY:    ${{ secrets.AX_POST_AI || secrets.OPENAI_API_KEY }}
          FEEDLY_TOKEN:      ${{ secrets.FEEDLY_TOKEN }}
          FEEDLY_STREAM_ID:  ${{ secrets.FEEDLY_STREAM_ID }}
        run: |
          set -e
          X_LIMIT="${{ github.event.inputs.x_limit || '25' }}"
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          BUDGET="${{ github.event.inputs.budget || '40' }}"
          USE_OPENAI="${{ github.event.inputs.use_openai || 'true' }}"

          ARGS="--limit $LIMIT --x-limit $X_LIMIT --budget $BUDGET"
          if [ "$USE_OPENAI" = "false" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::running rule-based mode (no OpenAI calls)"
            ARGS="$ARGS --no-openai"
          else
            echo "::notice::OpenAI key detected — agents 7/8/12 will use it"
          fi

          # Print diagnostic header so failures are easier to attribute.
          python3 --version
          python3 -c "import sys; print('cwd ok:', sys.path[0] or '.')"
          echo "::group::pipeline run"
          python3 tools/run_radar_agents.py $ARGS
          echo "::endgroup::"

      # ----- Translate new signals into Arabic (free MyMemory API) -----
      - name: Translate new signals to Arabic
        continue-on-error: true
        run: python3 tools/translate_signals.py

      # ----- Rebuild the inline radar data blob -----
      # radar.html loads assets/js/radar-inline-data.js BEFORE radar.js so the
      # first paint shows real data immediately (no async fetch flash). If we
      # update data/*.json without rebuilding this blob, the UI stays frozen
      # on the previous cron's snapshot. Always run this AFTER all data files
      # are finalized for the tick.
      - name: Rebuild inline radar data
        continue-on-error: true
        run: python3 tools/build_inline_radar_data.py

      - name: Commit & push data changes
        run: |
          git config user.name  "rib198"
          git config user.email "147077350+rib198@users.noreply.github.com"

          # Include the inline-data blob in the change check + commit so it
          # stays in lockstep with the JSON files it embeds.
          if git diff --quiet -- data/ assets/js/radar-inline-data.js ; then
            echo "no data changes — nothing to commit"
            exit 0
          fi

          git add data/ assets/js/radar-inline-data.js
          git commit -m "chore(radar): auto-refresh $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Push with retry loop. A parallel cron commit on the same branch
          # can land between our rebase and our push, so retry up to 3 times.
          # If all attempts fail, drop our commit silently — the next run
          # regenerates everything from current sources anyway, and exiting 0
          # keeps the workflow run green.
          BRANCH="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            if ! git rebase -X theirs "origin/$BRANCH" ; then
              git rebase --abort || true
              echo "::warning::rebase conflict on attempt $attempt — skipping push"
              exit 0
            fi
            if git push origin "HEAD:$BRANCH" ; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected on attempt $attempt — retrying"
            sleep $(( attempt * 3 ))
          done
          echo "::warning::push failed after 3 attempts — dropping this run's commit"
          exit 0

      # ---- Mirror to the deploy repo that Vercel watches (rib198/ax-pulse01) ----
      # The cron writes the public-facing data into origin/main, but Vercel is
      # connected to a *separate* repo (rib198/ax-pulse01) for deployment.
      # Without this mirror step, every cron's output had to be hand-pushed
      # to deploy/main, otherwise Vercel kept serving stale opportunities,
      # signals, and inline-data.
      #
      # Requires GitHub secret DEPLOY_PUSH_TOKEN — a classic PAT with `repo`
      # scope that grants push access to rib198/ax-pulse01. When missing, the
      # step warns and exits 0 so the cron still completes; mirroring just
      # falls back to whatever last hand-push happened.
      - name: Mirror main to deploy repo (ax-pulse01) for Vercel
        if: success()
        env:
          DEPLOY_PUSH_TOKEN: ${{ secrets.DEPLOY_PUSH_TOKEN }}
        run: |
          if [ -z "$DEPLOY_PUSH_TOKEN" ]; then
            echo "::warning::DEPLOY_PUSH_TOKEN not set — skipping mirror to ax-pulse01."
            echo "::warning::Vercel will keep serving stale data until you add the secret."
            echo "::warning::See: Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi

          # Configure the deploy remote with the token baked in (URL is
          # ephemeral — gone with the runner — so no persistent secret leak).
          git remote remove deploy 2>/dev/null || true
          git remote add deploy "https://x-access-token:${DEPLOY_PUSH_TOKEN}@github.com/rib198/ax-pulse01.git"

          BRANCH="${GITHUB_REF_NAME:-main}"

          # Try a fast-forward push first. If deploy has diverged (e.g. someone
          # hand-pushed there), fetch + rebase ours on top (taking deploy's
          # binary/orphan changes if any), then retry. Same 3-attempt loop as
          # the origin push above for resilience.
          for attempt in 1 2 3; do
            if git push deploy "HEAD:$BRANCH" 2>&1; then
              echo "mirrored to deploy/$BRANCH on attempt $attempt"
              exit 0
            fi
            echo "::warning::deploy push rejected on attempt $attempt — fetching + rebasing"
            git fetch deploy "$BRANCH" || { echo "::warning::deploy fetch failed"; exit 0; }
            # Prefer our data (origin is the source of truth); -X theirs would
            # discard our cron output, so use -X ours instead.
            if ! git rebase -X ours "deploy/$BRANCH" ; then
              git rebase --abort || true
              echo "::warning::deploy rebase conflict — dropping mirror this tick"
              exit 0
            fi
            sleep $(( attempt * 2 ))
          done
          echo "::warning::mirror failed after 3 attempts — Vercel will see this tick's data next run"
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "### Radar — agent pipeline run" >> $GITHUB_STEP_SUMMARY
          if [ -f data/radar/signals.json ]; then
            count=$(python3 -c "import json; print(json.load(open('data/radar/signals.json')).get('count', 0))")
            echo "- signals: $count" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/radar/run_status.json ]; then
            python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d=json.load(open('data/radar/run_status.json'))
          print(f"- حالة التشغيل: {d.get('status')}")
          print(f"- مصادر ناجحة: {len(d.get('sources_succeeded', []))}")
          print(f"- مصادر فاشلة: {', '.join(d.get('sources_failed', [])) or '-'}")
          print(f"- مصادر متخطاة: {', '.join(d.get('skipped_sources', [])) or '-'}")
          for err in d.get('errors', [])[:5]:
              print(f"  - {err.get('source')}: {err.get('error')}")
          PY
          fi
          if [ -f data/radar/opportunities.json ]; then
            opps=$(python3 -c "import json; d=json.load(open('data/radar/opportunities.json')); print(len(d.get('opportunities', [])))")
            free=$(python3 -c "import json; d=json.load(open('data/radar/opportunities.json')); print(sum(1 for o in d.get('opportunities', []) if o.get('tier')=='free'))")
            premium=$(python3 -c "import json; d=json.load(open('data/radar/opportunities.json')); print(sum(1 for o in d.get('opportunities', []) if o.get('tier')=='premium'))")
            echo "- opportunities: $opps (free: $free, premium: $premium)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/radar/agents/run_log.json ]; then
            calls=$(python3 -c "import json; print(json.load(open('data/radar/agents/run_log.json')).get('openai_calls', 0))")
            echo "- openai calls: $calls" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/newsletters/items.json ]; then
            news=$(python3 -c "import json; print(json.load(open('data/newsletters/items.json')).get('total_items', 0))")
            echo "- RSS newsletter items: $news" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- run time: $(date -u)" >> $GITHUB_STEP_SUMMARY
